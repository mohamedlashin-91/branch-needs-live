name: Live branch stock
# Every 30 minutes from 10:07 AM to 12:07 AM Riyadh time (GitHub times are UTC = Riyadh - 3 h).
# GitHub's own schedule is often late or skipped, so each run also starts the next one itself (job "next"),
# at the next :07 / :37 slot, until 12:07 AM. The schedule below only has to fire once in the morning.
# Publishes branch stock only (no warehouse stock) for the Branch Needs site. Manual run: Actions > Run workflow.
on:
  schedule:
    - cron: '7,37 7-20 * * *'
    - cron: '7 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['live/**', '.github/workflows/live-stock.yml']
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: live-stock
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q python-calamine numpy
      - name: Read the day's link file
        id: ref
        env:
          STOCK_URL: ${{ secrets.STOCK_URL }}
        run: python3 live/ref.py
      - name: Morning stock (once per build)
        uses: actions/cache@v4
        with:
          path: morning
          key: morning-${{ steps.ref.outputs.build }}
      - name: Download the website stock and build the files
        env:
          STOCK_URL: ${{ secrets.STOCK_URL }}
        run: python3 live/build_live.py
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry the publish once
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Delete the uploaded copies (on a public repo they could be downloaded)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for id in $(gh api "/repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=100" --jq '.artifacts[].id'); do
            gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null && n=$((n+1))
          done
          echo "uploaded copies deleted: $n"
      - name: Keep the schedule on (GitHub pauses schedules after 60 days without a commit)
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -q -m "Keep the live stock schedule active"
            git push -q
          fi

  next:
    # Start the next run at the next :07 / :37 slot (10:07 AM - 12:07 AM Riyadh), even if this run failed.
    # Only one run of this workflow can run at a time and only one can wait (concurrency above), so there is
    # never more than one chain: a scheduled run that comes in meanwhile simply takes the waiting place.
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for the next half hour, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(python3 - <<'PY'
          import datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          t = now.replace(second=0, microsecond=0)
          while not (t.minute in (7, 37) and (t - now).total_seconds() >= 150):
              t += dt.timedelta(minutes=1)
          day = 7 <= t.hour <= 20 or (t.hour == 21 and t.minute == 7)
          print(int((t - now).total_seconds()) - 40 if day else -1)
          PY
          )
          if [ "$wait" -lt 0 ]; then echo "last run of the day - the schedule starts tomorrow's runs"; exit 0; fi
          echo "next run in $(( (wait + 40) / 60 )) minutes"
          sleep "$wait"
          gh workflow run live-stock.yml --repo "${{ github.repository }}" --ref main
          echo "next run started"

