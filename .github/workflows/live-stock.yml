name: Live branch stock
# Publishes branch stock (no warehouse stock) for the Branch Needs site every 30 minutes, at :07 and :37,
# from 6:07 AM to 2:07 AM Riyadh time (GitHub times are UTC = Riyadh - 3 h).
# It keeps itself running day and night: each run starts the next one (job "next"); at night it only
# waits (job "publish" is skipped) and starts the 6:07 AM run itself, so it never depends on GitHub's own
# timer, which is often hours late or skipped. If starting the next run fails, it retries for up to 20
# minutes and then job "rescue" tries again. The schedule below is only a backup that restarts it.
# Manual restart: Actions > Live branch stock > Run workflow. Pause: add an empty file live/OFF.
on:
  schedule:
    - cron: '7,37 3-22 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['live/**', '.github/workflows/live-stock.yml']
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write
concurrency:
  group: live-stock
  cancel-in-progress: false
jobs:
  when:
    # Publish only in the day window (6:00 AM - 2:20 AM Riyadh) or when the workflow itself was changed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      day: ${{ steps.t.outputs.day }}
    steps:
      - id: t
        run: |
          m=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          if [ "${{ github.event_name }}" = "push" ] || { [ $m -ge 180 ] && [ $m -le 1400 ]; }; then d=true; else d=false; fi
          echo "day=$d" >> "$GITHUB_OUTPUT"; echo "publish now: $d (UTC $(date -u +%H:%M))"

  publish:
    needs: when
    if: needs.when.outputs.day == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q python-calamine numpy
      - name: Read the day's link file
        id: ref
        env:
          STOCK_URL: ${{ secrets.STOCK_URL }}
        run: python3 live/ref.py
      - name: Morning stock (once per build)
        uses: actions/cache@v4
        with:
          path: morning
          key: morning-${{ steps.ref.outputs.build }}
      - name: Download the website stock and build the files
        id: build
        env:
          STOCK_URL: ${{ secrets.STOCK_URL }}
          STOCK_EXPORT_URL: ${{ secrets.STOCK_EXPORT_URL }}
          STOCK_HEADER: ${{ secrets.STOCK_HEADER }}
        run: python3 -u live/build_live.py
      - uses: actions/configure-pages@v5
        if: steps.build.outputs.published == 'true'
      - id: upload
        if: steps.build.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - id: deployment
        if: steps.build.outputs.published == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry the publish once
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Delete the uploaded copies (on a public repo they could be downloaded)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for id in $(gh api "/repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=100" --jq '.artifacts[].id'); do
            gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null && n=$((n+1))
          done
          echo "uploaded copies deleted: $n"
      - name: Alert when the stock has not updated for over 75 minutes (opens one issue; GitHub emails the owner)
        if: failure() || steps.build.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_URL: ${{ secrets.STOCK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          last=$(python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          k = hashlib.sha256((os.environ['STOCK_URL'].strip() + '|bn-live-2').encode()).hexdigest()[:24]
          try:
              m = json.load(urllib.request.urlopen(f'https://mohamedlashin-91.github.io/branch-needs-live/{k}/meta.json', timeout=30))
              t = datetime.strptime(m['t'], '%Y-%m-%d %H:%M').replace(tzinfo=timezone(timedelta(hours=3)))
              age = (datetime.now(timezone.utc) - t).total_seconds() / 60
              print(t.strftime('%Y-%m-%d_%H:%M'), int(age))
          except Exception:
              print('unknown', 999)
          PY
          )
          t=$(echo "$last" | tail -1 | cut -d' ' -f1 | tr -cd '0-9:_-' | tr '_' ' '); age=$(echo "$last" | tail -1 | cut -d' ' -f2 | tr -cd '0-9')
          echo "last good stock: $t ($age minutes ago)"
          [ "${age:-999}" -lt 75 ] && exit 0
          body="The live branch stock has not updated since ${t:-unknown} (Riyadh). The latest run could not get the stock Excel file from the store website: $RUN_URL. Branch pages keep the last good stock and show 'Not updated since'. This issue closes itself when the stock updates again."
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "Live stock is not updating in:title" --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            gh issue create --repo "${{ github.repository }}" --title "Live stock is not updating" --body "$body"
          else
            gh issue edit "$n" --repo "${{ github.repository }}" --body "$body"
          fi
      - name: Close the alert when the stock updates again
        if: success() && steps.build.outputs.published == 'true' && hashFiles('carried.flag') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "${{ github.repository }}" --state open --search "Live stock is not updating in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "${{ github.repository }}" --comment "Updating again ($(TZ=Asia/Riyadh date '+%d %b %H:%M') Riyadh)."
          done
      - name: Keep the schedule on (GitHub pauses schedules after 60 days without a commit)
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -q -m "Keep the live stock schedule active"
            git push -q
          fi

  next:
    # Wait for the next :07 / :37 slot of the day window and start the next run. After the 2:07 AM run it
    # waits through the night (a job may run at most 6 hours, so a longer wait is split in two), so the 6:07 AM
    # run starts by itself. Only one run can run and one wait at a time (concurrency above), so there is never
    # more than one chain: a backup scheduled run that comes in meanwhile simply takes the waiting place.
    needs: [when, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait for the next slot, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(python3 - <<'PY'
          import datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          t = now.replace(second=0, microsecond=0)
          def day(t):
              return t.minute in (7, 37) and (3 <= t.hour <= 22 or (t.hour == 23 and t.minute == 7))
          while not (day(t) and (t - now).total_seconds() >= 150):
              t += dt.timedelta(minutes=1)
          w = int((t - now).total_seconds()) - 40
          print(min(w, 19800))   # at most 5.5 hours; a night run then waits the rest
          PY
          )
          echo "next run in $(( (wait + 40) / 60 )) minutes"
          sleep "$wait"
          for i in $(seq 1 20); do
            if gh workflow run live-stock.yml --repo "${{ github.repository }}" --ref main; then echo "next run started"; exit 0; fi
            echo "could not start the next run (try $i of 20) - trying again in 60 seconds"; sleep 60
          done
          exit 1

  rescue:
    # Only if "next" did not start the next run (GitHub error, runner lost): start it now, retrying.
    needs: next
    if: ${{ !cancelled() && needs.next.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Start the next run now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh workflow run live-stock.yml --repo "${{ github.repository }}" --ref main; then echo "next run started"; exit 0; fi
            echo "could not start the next run (try $i of 30) - trying again in 60 seconds"; sleep 60
          done
          exit 1
